/* ================= TAVERN JOIN CODE ================= */
const CODE_CHARS="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const genCode=()=>Array.from({length:6},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join("");
async function passHash(room,pass){const txt="ql:"+room+":"+String(pass).trim().toUpperCase();
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
  catch(e){let h=0;for(const ch of txt)h=(h*31+ch.charCodeAt(0))|0;return "h"+h;}}
const dmCodeRef=room=>TB.db.doc("data/users/"+TB.uid+"/profile").collection("tavern").doc(room);
async function loadDmCode(){if(!S.table)return;try{const s=await dmCodeRef(S.table.code).get();TB.dmCode=s.exists?(s.data().pass||""):"";}catch(e){}paint();}
async function saveDmCode(){try{await dmCodeRef(S.table.code).set({pass:TB.dmCode,at:Date.now()});}catch(e){}}
async function updSettings(o){try{await TB.db.doc("tables/"+S.table.code+"/meta/settings").update(o);return true;}catch(e){toast({t:"Couldn't save the setting",r:"✕",d:"Check your connection.",k:"fumble"});return false;}}
async function setLock(on){if(!isDmSeat())return;
  if(on){if(!TB.dmCode){TB.dmCode=genCode();await saveDmCode();}const h=await passHash(S.table.code,TB.dmCode);
    if(await updSettings({lock:true,passHash:h,members:partyNow().map(p=>p.id)}))toast({t:"Tavern locked",r:TB.dmCode,d:"New players need this join code. Players already inside stay in.",k:"good"});}
  else if(await updSettings({lock:false}))toast({t:"Tavern unlocked",r:"✓",d:"Anyone with the tavern name can enter.",k:""});}
async function newDmCode(){if(!isDmSeat())return;TB.dmCode=genCode();await saveDmCode();const h=await passHash(S.table.code,TB.dmCode);
  if(await updSettings({passHash:h,members:partyNow().map(p=>p.id)}))toast({t:"New join code",r:TB.dmCode,d:"Players inside right now stay in. Everyone else needs the new code.",k:"good"});}
function checkAccess(){const st=TB.settings;if(!S.table||!st||!st.lock||!st.passHash)return;
  if(S.table.role==="dm"&&(st.owner===TB.uid||st.dm===TB.uid))return;
  if((st.members||[]).includes(TB.uid)||S.table.passOk===st.passHash)return;
  const room=S.table.code;leaveTable();TF.code=room;TF.needPass=true;TF.err="The DM locked the tavern or changed the join code. Type the code to come back in.";
  toast({t:"Locked out of the tavern",r:"✕",d:"Ask your DM for the join code.",k:"fumble"});}
async function tryJoin(){
  const room=tcode(document.getElementById("t_code").value);if(!room){document.getElementById("t_code").focus();return;}TF.code=room;
  const ch=document.getElementById("t_char");if(TF.role==="player"&&ch&&ch.value)S.active=ch.value;
  let st=null;try{const s=await TB.db.doc("tables/"+room+"/meta/settings").get();st=s.exists?s.data():null;}catch(e){}
  const role=TF.role;
  if(!st||!st.lock||!st.passHash||(st.members||[]).includes(TB.uid)||(role==="dm"&&(st.owner===TB.uid||st.dm===TB.uid))){TF.needPass=false;TF.err="";return joinTable(room,role);}
  const pe=document.getElementById("t_pass"),pass=pe?pe.value.trim():"";
  if(!pass){TF.needPass=true;TF.err="This tavern is locked. Type the join code from your DM.";return render();}
  const h=await passHash(room,pass);
  if(h!==st.passHash){TF.needPass=true;TF.err="That code didn't work. Check with your DM.";return render();}
  TF.needPass=false;TF.err="";joinTable(room,role,h);
}

/* ================= 3D DICE (self-contained: polyhedra, lighting, wall bounces) ================= */

const V3={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],

    const c=V3.cross(a,b),q=[1+d,c[0],c[1],c[2]],l=Math.hypot(...q);return q.map(x=>x/l);},
  rot:(q,v)=>{const [w,x,y,z]=q,t=[2*(y*v[2]-z*v[1]),2*(z*v[0]-x*v[2]),2*(x*v[1]-y*v[0])];return [v[0]+w*t[0]+(y*t[2]-z*t[1]),v[1]+w*t[1]+(z*t[0]-x*t[2]),v[2]+w*t[2]+(x*t[1]-y*t[0])];}};
const PHI=(1+Math.sqrt(5))/2;

    for(let k=0;k<5;k++){const a=k*2*Math.PI/5,b=a+Math.PI/5;v.push([Math.cos(a),h,Math.sin(a)]);v.push([Math.cos(b),-h,Math.sin(b)]);}return v;}

const POLY={};
function getPoly(f){
  const key=f===100?10:f;if(POLY[key])return POLY[key];
  const raw=polyVerts(key),R=Math.max(...raw.map(V3.len)),V=raw.map(v=>V3.mul(v,1/R)),faces=[],seen=[];
  for(let i=0;i<V.length;i++)for(let j=i+1;j<V.length;j++)for(let k=j+1;k<V.length;k++){
    let n=V3.cross(V3.sub(V[j],V[i]),V3.sub(V[k],V[i]));if(V3.len(n)<1e-6)continue;n=V3.norm(n);let d=V3.dot(n,V[i]);if(d<0){n=V3.mul(n,-1);d=-d;}

function backupChar(c,reason,force){

    const per={},keep=[];all.forEach(b=>{per[b.cid]=(per[b.cid]||0)+1;if(per[b.cid]<=8)keep.push(b);else col.doc(b._id).delete().catch(()=>{});});CLB.list=keep;}catch(e){}

function backupsHtml(){

  const seen=new Set(),all=[...(S.backups||[]),...CLB.list].filter(b=>{const k=b.cid+":"+b.at;if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>b.at-a.at);
  const groups={};all.forEach(b=>{(groups[b.cid]=groups[b.cid]||[]).push(b);});
  const when=t=>new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  const ids=Object.keys(groups);

    <p class="note">Every character is backed up automatically about once an hour while you play, before leveling down, and before it's deleted. Tap Restore to go back to an earlier version.${CL.on?" Backups are saved to your account too.":""}</p>
    ${ids.length?ids.map(cid=>{const list=groups[cid].slice(0,6),live=S.chars.find(x=>x.id===cid),nm=live?live.name:list[0].name;
      return `<div class="eyebrow" style="margin-top:12px">${esc(nm)}${live?"":` <span class="pill r-veryrare">deleted</span>`}</div>
      ${list.map(b=>{const key=b.cid+":"+b.at,ask=RESTORE_ASK===key;return `<div class="irow"><div style="min-width:0"><b>${when(b.at)}</b> <span class="note">Level ${b.level} · ${esc(b.reason==="auto"?"automatic":b.reason)}</span></div>
        <div class="acts">${ask?`<span class="note">Replace the current version?</span><button class="btn sm danger" data-act="bkYes" data-k="${esc(key)}">Yes, restore</button><button class="btn sm" data-act="bkNo">Cancel</button>`:`<button class="btn sm" data-act="bkAsk" data-k="${esc(key)}">${live?"Restore":"Bring back"}</button>`}</div></div>`;}).join("")}`;}).join("")
      :`<p class="note">No backups yet. They start as soon as you edit a character.</p>`}
  </div>`;
}
function restoreBackup(key){
  const seen=[...(S.backups||[]),...CLB.list],b=seen.find(x=>x.cid+":"+x.at===key);if(!b)return;

/* ================= CONDITIONS THAT DO THE MATH (5e rules) ================= */
// atk/chk/sav: "adv" or "dis" on your own rolls · fail: saves that fail automatically · spd0: speed 0 · vs: how attacks against you roll
const COND_RULES={
  Blinded:{atk:"dis",vs:"adv",txt:"Disadvantage on your attacks. Attacks against you have advantage. You fail checks that need sight."},
  Charmed:{txt:"You can't attack the charmer. They have advantage on social checks against you."},
  Deafened:{txt:"You fail checks that need hearing."},
  Frightened:{atk:"dis",chk:"dis",txt:"Disadvantage on attacks and ability checks while you can see the source. You can't move closer to it."},
  Grappled:{spd0:1,txt:"Your speed is 0."},
  Incapacitated:{txt:"You can't take actions or reactions."},
  Invisible:{atk:"adv",vs:"dis",txt:"Advantage on your attacks. Attacks against you have disadvantage."},
  Paralyzed:{spd0:1,fail:["STR","DEX"],vs:"adv",crit5:1,txt:"You can't move or act. You fail STR and DEX saves. Attacks against you have advantage, and hits from within 5 ft are critical hits."},
  Poisoned:{atk:"dis",chk:"dis",txt:"Disadvantage on attacks and ability checks."},
  Prone:{atk:"dis",vs:"prone",txt:"Disadvantage on your attacks. Melee attacks against you have advantage, ranged ones have disadvantage. Standing up costs half your speed."},
  Restrained:{atk:"dis",spd0:1,savDex:"dis",vs:"adv",txt:"Your speed is 0. Disadvantage on attacks and DEX saves. Attacks against you have advantage."},
  Stunned:{spd0:1,fail:["STR","DEX"],vs:"adv",txt:"You can't move or act. You fail STR and DEX saves. Attacks against you have advantage."},
  Unconscious:{spd0:1,fail:["STR","DEX"],vs:"adv",crit5:1,txt:"You drop prone and can't act. You fail STR and DEX saves. Attacks against you have advantage, and hits from within 5 ft are critical hits."}
};
const EXH_RULES=["","Disadvantage on ability checks","Speed halved","Disadvantage on attacks and saving throws","Hit point maximum halved","Speed 0","Death"];
const condList=c=>(c.conds||[]).filter(k=>k!=="Exhaustion"&&COND_RULES[k]);
function saveAbFromLabel(l){const m=String(l).match(/\b(Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma)\b/i);if(m)return AB.find(a=>AB_FULL[a].toLowerCase()===m[1].toLowerCase());
  const k=String(l).match(/\((STR|DEX|CON|INT|WIS|CHA)\)/);return k?k[1]:null;}
/* how the character's own conditions change a roll of this kind */
function condEffect(c,kind,label){
  const out={adv:[],dis:[],fail:""};if(!c||!kind||kind==="damage")return out;const ab=kind==="save"?saveAbFromLabel(label):null,exh=c.exh||0;
  condList(c).forEach(k=>{const R=COND_RULES[k];
    if(kind==="attack"&&R.atk)(R.atk==="adv"?out.adv:out.dis).push(k);
    if(kind==="check"&&R.chk)out.dis.push(k);
    if(kind==="save"&&ab&&(R.fail||[]).includes(ab))out.fail=k;
    if(kind==="save"&&ab==="DEX"&&R.savDex)out.dis.push(k);});
  if(exh>=1&&kind==="check")out.dis.push("Exhaustion "+exh);
  if(exh>=3&&(kind==="attack"||kind==="save"))out.dis.push("Exhaustion "+exh);
  return out;
}
const combineMode=(base,adv,dis)=>{const a=adv||base==="adv",d=dis||base==="dis";return a&&!d?"adv":d&&!a?"dis":"normal";};
function condSummary(c){const lines=condList(c).map(k=>`${k}: ${COND_RULES[k].txt}`);if(c.exh)lines.push(`Exhaustion ${c.exh}: ${EXH_RULES.slice(1,c.exh+1).join("; ")}.`);return lines;}
/* attacks against a target with these conditions */

    else{const PF=POTION_FX[it.k];upd(c=>{const x=findIt(c,it.id);x.q--;if(x.q<=0)c.inv=c.inv.filter(i=>i!==x);
        if(PF){c.effects=c.effects||[];if(PF.temp)c.hp.temp=Math.max(c.hp.temp||0,PF.temp);c.effects.push({n:PF.n,from:it.n,castId:uid(),custom:PF.custom||null,rounds:PF.rounds||0});}});
      toast({t:"Used "+it.n,r:"✦",d:PF?`${PF.n}: ${PF.custom?fxDesc(Object.assign({},PF.custom,{rounds:PF.rounds||0})):"+1d4 to attacks and saves"}${PF.temp?` · ${PF.temp} temp HP`:""}. Shown under Active effects.`:m.desc||"",k:"good"});}}
  else if(a==="rmFeat")upd(c=>{const r=c.feats[+t.dataset.i];if(r&&!r.lvl){removeFeat(c,r);recalcMax(c);}});
  else if(a==="freeCast")upd(c=>{const s=c.spells[+t.dataset.i];if(s)s.used=!s.used;});
  else if(a==="prepT")upd(c=>{const s=c.spells[+t.dataset.i];if(!s)return;const R=spellRules(c);
    if(s.prep===false){if(spellCounts(c).prep<R.prep)s.prep=true;else toast({t:"Prepared list is full",r:"✕",d:`You can prepare ${R.prep} spells. Unprepare one first.`,k:"fumble"});}else s.prep=false;});
  else if(a==="fxAdd"){const v=document.getElementById("fxAdd").value;if(!v)return;const [n,die]=v.split("|");upd(c=>{c.effects=c.effects||[];c.effects.push({n,die:die||"",from:""});});}
  else if(a==="fxEnd")upd(c=>{const ef=(c.effects||[])[+t.dataset.i];if(!ef)return;c.effects=c.effects.filter(x=>x!==ef);if(c.conc&&ef.castId===c.conc.castId&&!(c.conc.to||[]).length)c.conc=null;});
  else if(a==="concEnd")upd(c=>endConcSend(c));
  else if(a==="concRound")upd(c=>{if(!c.conc)return;c.conc.rounds=(c.conc.rounds??10)-1;if(c.conc.rounds<=0){const n=c.conc.n;endConcSend(c);toast({t:`${n} ended`,r:"⏱",d:"1 minute is up.",k:""});}});
  else if(a==="concRoll"){const SC=eff(c);d20(mod(SC.CON)+(saveProfs(c).includes("CON")?prof(c.level):0)+saveBonus(c),"Concentration save (CON)");}
  else if(a==="breathT")upd(c=>{c.breathUsed=!c.breathUsed;});
  else if(a==="breath"){const BR=breathInfo(c);if(!BR||c.breathUsed)return;upd(c=>{c.breathUsed=true;unlockAch(c,"breath");});rollExpr(BR.dice,`${c.name} Breath Weapon (${BR.t}, DC ${BR.dc} ${BR.sv})`);}
});
M.addEventListener("change",e=>{
  const t=e.target;if(!cur())return;
  if(t.id==="subsel")upd(c=>{c.sub=t.value;recalcMax(c);});
  else if(t.id==="acAdj")upd(c=>{c.acAdj=parseInt(t.value)||0;});
  else if(t.id==="ancsel")upd(c=>{c.ancestry=t.value;});
  else if(t.id==="exhSel")upd(c=>{c.exh=+t.value;if(c.exh>=4)c.hp.cur=Math.min(c.hp.cur,Math.floor(c.hp.max/2));if(c.exh>=6)toast({t:"Exhaustion 6",r:"☠",d:"In 5e, level 6 exhaustion means death. Talk to your DM.",k:"fumble"});});
});

/* ================= MODAL EVENTS ================= */

/* ================= MAP / PORTRAIT / BACKUP EVENTS ================= */
M.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="bkAsk"){RESTORE_ASK=t.dataset.k;render();return;}
  if(a==="bkNo"){RESTORE_ASK=null;render();return;}
  if(a==="bkYes"){restoreBackup(t.dataset.k);return;}
  if(a==="rmPortrait"){upd(c=>{delete c.portrait;delete c.thumb;});return;}
  if(a==="mapGrid")return;
  if(a==="mapMine"){const c=cur();if(!c||!S.table||!TB.db)return;
    TB.db.collection("tables/"+S.table.code+"/tokens").doc("pc-"+TB.uid).set({x:.5,y:.5,label:c.name,kind:"pc",u:TB.uid,thumb:safeImg(c.thumb)||"",at:Date.now()}).catch(()=>{});return;}
  if(!isDmSeat())return;
  if(a==="mapEdit"){MAPST.editing=!MAPST.editing;if(MAPST.editing)MAPST.walling=false;render();return;}
  if(a==="mapWalls"){MAPST.walling=!MAPST.walling;if(MAPST.walling){MAPST.editing=false;MAPST.grid=MAPST.grid||MAPST.snap;}render();return;}
  if(a==="wTool"){MAPST.wtool=t.dataset.k;render();return;}
  if(a==="wUndo"){const prev=MAPST.wundo.pop();if(prev!=null){MAPST.walls=parseWalls(prev);drawMap();saveWallsSoon();render();}return;}
  if(a==="wClear"){setWalls([]);render();return;}
  if(a==="mapBrush"){MAPST.brush=t.dataset.b;render();return;}
  if(a==="mapSize"){MAPST.size=+t.dataset.n;render();return;}
  if(a==="mapAll"){MAPST.fog=MAPST.fog.map(()=>t.dataset.v==="1");drawMap();saveFogSoon();return;}
  if(a==="mapRemove"){const m=TB.map;if(!m)return;TB.db.doc("tables/"+S.table.code+"/meta/map").set({mapId:"",at:Date.now()}).catch(()=>{});
    for(let i=0;i<(m.chunks||0);i++)TB.db.collection("tables/"+S.table.code+"/mapchunks").doc(m.mapId+"-"+i).delete().catch(()=>{});return;}
  if(a==="tokAdd"){const n=(DMS.tokn||"").trim();if(!n){toast({t:"Name the token",r:"✕",d:"Type a name like Goblin 1.",k:"fumble"});return;}
    TB.db.collection("tables/"+S.table.code+"/tokens").doc("npc-"+uid()).set({x:.5,y:.5,label:n.slice(0,24),kind:"npc",u:"npc",at:Date.now()}).catch(()=>{});
    DMS.tokn=n.replace(/(\d+)$/,m=>String(+m+1));render();return;}
  if(a==="tokDel"){TB.db.collection("tables/"+S.table.code+"/tokens").doc(t.dataset.id).delete().catch(()=>{});return;}
  if(a==="dmAch"){const n=(DMS.achn||"").trim();if(!n){toast({t:"Name the achievement",r:"✕",d:"Something like Goblin Whisperer.",k:"fumble"});return;}const tg=targetsFor(DMS.pa||"all");if(!tg.length)return;
    sendEvent({type:"ach",name:n.slice(0,60),desc:(DMS.achd||"").trim().slice(0,140),to:tg.map(p=>({u:p.id,ch:p.charId}))}).then(ok=>{if(ok){toast({t:"Achievement awarded",r:"✦",d:`${n} → ${tg.length>1?tg.length+" players":tg[0].char}`,k:""});DMS.achn="";DMS.achd="";render();}});return;}
});
M.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="portraitIn"&&t.files&&t.files[0]){try{const img=await loadImgFile(t.files[0]);const big=squareShot(img,256,.82),small=squareShot(img,96,.75);upd(c=>{c.portrait=big;c.thumb=small;});
      toast({t:"Portrait saved",r:"✓",d:"It shows on your sheet, in the tavern and on the map.",k:"good"});}catch(err){toast({t:"That file isn't a picture",r:"✕",d:"Pick a JPG, PNG or WebP image.",k:"fumble"});}return;}
  if(t.id==="mapGrid"){MAPST.grid=t.checked;drawMap();return;}
  if(t.id==="wSnap"){MAPST.snap=t.checked;return;}
  if(!isDmSeat())return;
  if(t.id==="mapIn"&&t.files&&t.files[0]){uploadMap(t.files[0]);t.value="";return;}
  if(t.id==="mapShow"){TB.db.doc("tables/"+S.table.code+"/meta/map").update({show:t.checked}).catch(()=>{});return;}
});
M.addEventListener("input",e=>{const t=e.target;if(t.id==="tok_n")DMS.tokn=t.value;else if(t.id==="dm_achn")DMS.achn=t.value;else if(t.id==="dm_achd")DMS.achd=t.value;});

const MD=document.getElementById("modal");
function redrawModal(){if(LV)drawLevel();else if(FTM)drawFeat();else if(ITM)drawShop();else if(CST)drawCast();else if(CSP)drawCustomSpell();else if(INI)drawInit();}
MD.addEventListener("click",e=>{
  if(e.target===MD)return closeLevel();
  const c=cur();if(!c&&!INI)return closeLevel();
  const lt=e.target.closest("[data-lact]");
  if(lt&&LV){const a=lt.dataset.lact;
    if(a==="step"){LV.to=Math.max(1,Math.min(20,LV.to+ +lt.dataset.d));drawLevel();}
    else if(a==="method"){LV.method=lt.dataset.m;drawLevel();}
    else if(a==="amode"){LV.amode[lt.dataset.l]=lt.dataset.m;drawLevel();}
    else if(a==="rollhp"){const p=levelPlan(c);p.range.forEach(L=>{LV.rolls[L]=rollExpr("1d"+p.cl.hd,`${c.name}: level ${L} HP`,"normal",true).r;});drawLevel();}
    else if(a==="cancel")closeLevel();
    else if(a==="apply")applyLevel();
    return;}
  const it0=e.target.closest("[data-iniact]");
  if(it0&&INI){if(it0.dataset.iniact==="roll")rollInitFor();else closeLevel();return;}
  const ct=e.target.closest("[data-cact]");
  if(ct&&CST){const a=ct.dataset.cact;if(a==="cancel")return closeLevel();
    if(a==="slot"){CST.slot=+ct.dataset.l;CST.free=false;return drawCast();}
    if(a==="free"){CST.free=true;return drawCast();}
    if(a==="ext"){CST.ext=Math.max(0,(CST.ext||0)+ +ct.dataset.d);return drawCast();}
    if(a==="cast")return doCast(false);if(a==="roll")return doCast(true);return;}
  const pt=e.target.closest("[data-pact]");
  if(pt&&CSP){if(pt.dataset.pact==="cancel")return closeLevel();if(pt.dataset.pact==="save")return saveCustomSpell();return;}
  const ft=e.target.closest("[data-fact]");
  if(ft&&FTM){if(ft.dataset.fact==="cancel")return closeLevel();
    if(ft.dataset.fact==="apply"&&featReady(FTM.st)){const st=FTM.st;upd(c=>{applyFeat(c,st,0);recalcMax(c);});closeLevel();toast({t:"Feat added",r:"✦",d:st.n,k:"good"});}
    return;}
  const it=e.target.closest("[data-iact]");
  if(it&&ITM){const a=it.dataset.iact;
    if(a==="cancel")return closeLevel();
    if(a==="tab"){ITM.tab=it.dataset.t;ITM.q="";ITM.sel=null;ITM.qty=1;ITM.msg="";return drawShop();}
    if(a==="sel"){ITM.sel=it.dataset.k;ITM.qty=1;ITM.base="";ITM.msg="";document.getElementById("itlist").innerHTML=shopListHtml();document.getElementById("itdet").innerHTML=shopDetail(c);return;}
    if(a==="buy"||a==="found"){const k=ITM.sel;if(!k)return;const m=ITM.tab==="magic"?MAGIC[k]:null,g=GEAR[k],per=g?g.per:1;
      const cost=m?(m.buy||0):(WEAPONS[k]||ARMOR[k]||g).cost,qty=stackable(k)?Math.max(1,Math.min(99,ITM.qty)):1,total=Math.round(cost*100)*qty;
      if(a==="buy"){if(m&&!m.buy)return;if(total>toCp(c.gold))return;}
      const base=m&&m.tpl?ITM.base:null,name=m?magicName(m,base):k;
      upd(c=>{if(a==="buy")c.gold=fromCp(toCp(c.gold)-total);addItem(c,{k,base,q:qty*per,src:a==="buy"?"bought":"found"});});
      ITM.msg=a==="buy"?`Bought ${qty*per>1?qty*per+" × ":""}${name} for ${fmtCost(total/100)}.`:`Added ${name}.`;return drawShop();}
    if(a==="custom"){const n=document.getElementById("cin").value.trim();if(!n){document.getElementById("cimsg").textContent="Give the item a name.";return;}
      const wt=+document.getElementById("ciw").value||0,note=document.getElementById("cid").value.trim();
      upd(c=>addItem(c,{custom:true,n,wt,note}));ITM.msg=`Added custom item: ${n}.`;return drawShop();}
  }
});
MD.addEventListener("change",e=>{const t=e.target,c=cur();if(!c)return;
  if(t.dataset.ctg&&CST){const id=t.dataset.ctg;CST.tg=t.checked?[...CST.tg,id]:CST.tg.filter(x=>x!==id);drawCast();return;}
  if(t.dataset.pf&&CSP){const f=t.dataset.pf;CSP[f]=t.type==="checkbox"?t.checked:f==="lvl"?+t.value:t.value;CSP.msg="";
    if(["lvl","k","school","sv","t","add","cs"].includes(f)||f==="d"||f==="up")drawCustomSpell();return;}
  if(t.dataset.fc){const st=t.dataset.fc==="bonus"?FTM&&FTM.st:LV&&LV.feat[t.dataset.fc.slice(1)];if(st){setFeatField(st,t.dataset.ff,t.value);redrawModal();}return;}
  if(t.dataset.lsub&&LV){LV.sub=t.value;drawLevel();return;}
  if(t.dataset.asi&&LV){const L=t.dataset.asi;LV.asi[L]=LV.asi[L]||["",""];LV.asi[L][+t.dataset.k]=t.value;drawLevel();return;}
  if(t.id==="itbase"&&ITM){ITM.base=t.value;document.getElementById("itdet").innerHTML=shopDetail(c);return;}
  if(t.id==="itqty"&&ITM){ITM.qty=Math.max(1,Math.min(99,parseInt(t.value)||1));document.getElementById("itdet").innerHTML=shopDetail(c);return;}
});
MD.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.pf&&CSP&&t.type!=="checkbox"&&t.tagName!=="SELECT"){CSP[t.dataset.pf]=t.value;}
  if(t.dataset.man&&LV){LV.manual[t.dataset.man]=t.value;updateLevelSummary();}
  if(t.id==="itq"&&ITM){ITM.q=t.value;document.getElementById("itlist").innerHTML=shopListHtml();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(LV||ITM||FTM||CST||CSP||INI))closeLevel();});

const START_GOLD={Barbarian:[2,10],Bard:[5,10],Cleric:[5,10],Druid:[2,10],Fighter:[5,10],Monk:[5,1],Paladin:[5,10],Ranger:[5,10],Rogue:[4,10],Sorcerer:[3,10],Warlock:[4,10],Wizard:[4,10]};
const avgGold=cls=>{const [n,x]=START_GOLD[cls];return Math.round(n*2.5*x);};
load();render();initTable();
</script>
